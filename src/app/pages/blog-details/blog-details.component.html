<div class="loader" *ngIf="isLoading">
    <img src="../../../assets/loader.gif"/>
</div>

<div *ngIf="isAdmin && isAuthenticated" class="blog-operations-bar">
    <button mat-raised-button color="basic" (click)="editBlog(id)">
        Edit
    </button>

    <button mat-raised-button color="warn" (click)="openDialog()">
        Delete
    </button>
</div>

<div class="blog-body">
    <div class="blog-content">
        <p class="blog-title">{{selectedBlog.title}}</p>
        <p> <img [src]="selectedBlog.imagePath" class="banner-image" /></p>
        <span class="content-font" innerHTML={{selectedBlog.content}}></span>
    </div>
    <!-- <div class="tag-container">
        <div class="tag-content" *ngFor="let tag of selectedBlog.tags">
            {{tag}}
        </div>
    </div> -->
</div>
<div class="footer-reading-list" *ngIf="isAuthenticated">
    <button *ngIf="showAddToReadingList" class="add-btn" mat-raised-button color="basic" (click)="addToReadingList(selectedBlog._id)">
        Add to Reading List
    </button>
    <button *ngIf="!showAddToReadingList" class="remove-btn" mat-raised-button color="warn" (click)="removeFromReadingList(selectedBlog._id)">
        Remove from Reading List
    </button>
</div>
<div class="recommended-blog-header">
    <p class="recommended-blog-header-text"> Here are some other blogs that you should checkout</p>
</div>
<div class="recommended-blog-feed" *ngIf="suggestedBlogs && suggestedBlogs.blogs.length > 0 ">
    <div *ngFor="let blog of suggestedBlogs.blogs">
        <div class="recommended-blog-card">
            <div class="recommended-blog-content">
                <div class="image-container" *ngIf="blog.imagePath">
                <img
                    [src]="blog.imagePath"
                    [alt]="blog.title"
                    class="rec-banner-image"
                />
                </div>
                <div class="content-container">
                <h1 class="heading">{{ blog.title }}</h1>
                <div
                    class="font-style"
                    [innerHTML]="blog.content.slice(0, 100)"
                ></div>
                <div class="button-container">
                    <a [routerLink]="['/blog-details/', blog.id, { relaiveTo: null }]"
                    ><button type="button" class="read-more-btn">
                        Read More
                    </button></a
                    >
                </div>
                </div>
            </div>
        </div>
    </div>
</div>
